version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bharatvoice_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bharatvoice-network

  redis:
    image: redis:7-alpine
    container_name: bharatvoice_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bharatvoice-network

  qdrant:
    image: qdrant/qdrant
    container_name: bharatvoice_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bharatvoice-network

  backend:
    build:
      context: ./apps/backend
    container_name: bharatvoice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bharatvoice-network

  celery:
    build:
      context: ./apps/backend
    container_name: bharatvoice_celery
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bharatvoice-network

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: bharatvoice_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - bharatvoice-network

networks:
  bharatvoice-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
